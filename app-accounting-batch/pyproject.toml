[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-accounting-batch"
version = "0.1.0"
description = "Accounting Batch Invoice AI Processing & XLSX Export Service"
requires-python = ">=3.11"
dependencies = [
    "core-shared",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.2",
    "google-generativeai>=0.5.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
