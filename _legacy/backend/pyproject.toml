[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-first-ai-backend"
version = "0.1.0"
description = "Provider-neutral backend contracts for the File-First AI Workspace"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
docling = ["docling==2.115.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires the optional Docling dependency and local models"]
