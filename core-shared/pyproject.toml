[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-shared"
version = "0.1.0"
description = "Provider-neutral domain models, port interfaces, and shared adapters for File-First AI Workspace"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
docling = ["docling==2.115.0"]
gemini  = ["google-generativeai>=0.8"]
openai  = ["openai>=1.0"]
dev     = ["pytest>=8.0", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["src/core_shared"]
